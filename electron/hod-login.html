<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; form-action 'none'; base-uri 'none'">
<title>HOD Study Planner Console</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f3f0;color:#202122;font:16px/1.5 "Segoe UI",sans-serif}
header{background:#151517;color:white;display:flex;align-items:center;gap:20px;padding:14px clamp(20px,5vw,72px);border-bottom:3px solid #dc2d27}
header img{height:36px}header strong{border-left:1px solid #57575a;padding-left:20px;font-size:16px}
main{min-height:calc(100vh - 67px);padding:clamp(20px,5vw,64px);display:grid;place-items:center}
.shell{display:grid;grid-template-columns:1fr 1.05fr;width:min(960px,100%);background:white;border:1px solid #dedbd6;border-radius:16px;overflow:hidden;box-shadow:0 16px 50px #24242410}
.intro{background:#242326;color:white;position:relative;overflow:hidden;padding:44px;display:flex;flex-direction:column;justify-content:flex-end;min-height:430px}
.art{position:relative;width:118px;height:100px;margin:0 0 auto 4px}.art i{position:absolute;display:block;width:86px;height:66px;transform:skewY(-13deg);border:2px solid #aaa6a4;background:#242326;border-radius:5px;top:0;left:0}
.art i:nth-child(2){top:10px;left:12px}.art i:last-child{top:20px;left:24px;background:#d73630;border-color:#ef6457}
.art i:last-child:after{content:"";position:absolute;top:16px;left:14px;width:48px;height:5px;border-block:2px solid #fff}
h1,h2,p{margin:0}h1{font-size:clamp(32px,4.2vw,50px);line-height:1.05;letter-spacing:-.045em;max-width:12ch}
.intro p{margin-top:16px;color:#d7d4d3;max-width:32ch}.form{padding:clamp(24px,4vw,52px);align-self:center}h2{font-size:29px;letter-spacing:-.04em}
label{display:block;margin:20px 0 6px;font-weight:600;font-size:14px}input,button{font:inherit}input{width:100%;padding:11px 13px;border:1px solid #aaa7a3;border-radius:7px}
.secret{position:relative}.secret input{padding-right:70px}.secret button{position:absolute;inset:4px 4px 4px auto;border:0;border-radius:4px;background:#f6f5f3;padding:0 12px;cursor:pointer}
#submit{margin:22px 0 0;width:100%;padding:12px;border:0;border-radius:7px;background:#bc2521;color:white;font-weight:650;cursor:pointer}#submit:disabled{opacity:.68}
.note,#connection{color:#575552;font-size:14px}.note{border-top:1px solid #e5e3df;margin-top:22px;padding-top:17px}
#error{color:#96211e;font-size:14px}#error:not(:empty){margin-top:12px}button:focus-visible,input:focus-visible{outline:3px solid #2972a4;outline-offset:2px}
@media(max-width:700px){.shell{grid-template-columns:1fr}.intro{min-height:0;padding:24px}.art{display:none}.intro p{margin-top:8px;max-width:none}h1{font-size:29px;max-width:none}main{padding:18px}}
</style>

<main><div class="shell"><section class="intro"><div class="art" aria-hidden="true"><i></i><i></i><i></i></div>
<h1>Official planner catalogue</h1><p>Review study planners, prepare drafts and manage published revisions.</p></section>
<section class="form"><h2>Publisher sign-in</h2><p id="connection" role="status">Sign in to connect to the central catalogue.</p>
<form id="login" autocomplete="off"><label for="username">Publisher username</label><input id="username" name="username" maxlength="100" required autofocus>
<label for="password">Password</label><div class="secret"><input id="password" name="password" type="password" maxlength="500" required><button id="toggle" type="button" aria-label="Show password" aria-controls="password">Show</button></div>
<p id="error" role="alert"></p><button id="submit" type="submit">Sign in</button></form>
<p class="note">Your credentials are used only for this desktop session and are never saved.</p></section></div></main>
<script>
const form = document.getElementById('login');
const button = document.getElementById('submit');
const error = document.getElementById('error');
const toggle = document.getElementById('toggle');
const connection = document.getElementById('connection');
function showPassword(show) {
  form.password.type = show ? 'text' : 'password';
  toggle.textContent = show ? 'Hide' : 'Show';
  toggle.setAttribute('aria-label', toggle.textContent + ' password');
}
toggle.onclick = () => showPassword(form.password.type === 'password');
form.addEventListener('submit', async event => {
  event.preventDefault();
  if (button.disabled) return;
  button.disabled = true;
  button.textContent = 'Signing in…';
  connection.textContent = 'Connecting to the central catalogue…';
  form.setAttribute('aria-busy','true');
  error.textContent = '';
  try {
    const pending = window.hodConsole.login({ username: form.username.value, password: form.password.value });
    form.password.value = '';
    showPassword(false);
    const result = await pending;
    if (result.ok) form.reset();
    else { error.textContent = result.message; form.password.focus(); }
  } catch {
    error.textContent = 'Please reopen the console and sign in again.';
  } finally {
    form.password.value = '';
    button.disabled = false;
    form.removeAttribute('aria-busy');
    connection.textContent = 'Sign in to connect to the central catalogue.';
    button.textContent = 'Sign in';
  }
});
</script></body></html>
