appId: com.hamm0208.studyplanner
productName: Student Study Planner
copyright: Copyright © 2025

publish:
  provider: github
  owner: NKXK26
  repo: Study-Planner-System
  releaseType: release
  publishAutoUpdate: true

artifactName: "Student-Study-Planner-Setup-${version}-${arch}.${ext}"

files:
  - "electron/**/*"
  - ".next-electron/standalone/**/*"
  - ".next-electron/static/**/*"
  - "public/**/*"
  - "prisma/schema.prisma"
  - "package.json"
  - "next.config.*"
  - "!.next-electron/cache/**"
  - "!.env*"
  - "!**/.env*"
  - "!*.md"
  - "!src/**"

directories:
  output: dist
  buildResources: build-resources

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build-resources/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  installerIcon: build-resources/icon.ico
  uninstallerIcon: build-resources/icon.ico

extraResources:
  - from: build-resources/node/node.exe
    to: node/node.exe
  - from: build-resources/icon.ico
    to: build-resources/icon.ico
  - from: .next-electron/standalone
    to: app
    filter:
      - "**/*"
      - "!**/.env*"
  - from: .next-electron/static
    to: app/.next-electron/static
  - from: public
    to: app/public
  - from: prisma/app.db
    to: app/prisma/app.db
