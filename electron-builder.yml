appId: com.hamm0208.studyplanner
productName: Student Study Planner
copyright: Copyright © 2025

publish:
  provider: github
  owner: NKXK26
  repo: Study-Planner-System
  releaseType: release
  publishAutoUpdate: true

artifactName: "Student-Study-Planner-Setup-${version}-${arch}.${ext}"

files:
  - "electron/*.js"
  - "electron/loading.html"
  - "prisma/schema.prisma"
  - "package.json"
  - "next.config.*"
  - "!.next-electron/cache/**"
  - "!.env*"
  - "!**/.env*"
  - "!*.md"
  - "!src/**"

beforePack: ./scripts/verify-desktop-seed.js

directories:
  output: dist
  buildResources: build-resources

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build-resources/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  installerIcon: build-resources/icon.ico
  uninstallerIcon: build-resources/icon.ico

extraResources:
  - from: build-resources/node/node.exe
    to: node/node.exe
  - from: build-resources/icon.ico
    to: build-resources/icon.ico
  - from: .next-electron/standalone
    to: app
    filter:
      - "server.js"
      - "package.json"
      - "node_modules/**/*"
      - ".next-electron/**/*"
      - "scripts/extract_colors.py"
      - "!**/.env*"
      - "!**/*.{db,sqlite,sqlite3,sql,bak,backup}*"
      - "!**/{public,uploads}/**"
  - from: .next-electron/static
    to: app/.next-electron/static
    filter:
      - "**/*"
      - "!**/*.{db,sqlite,sqlite3,sql,bak,backup}*"
      - "!**/.env*"
      - "!**/uploads/**"
  - from: public
    to: app/public
    filter:
      - "images/Website-banner-scaled.jpg"
      - "images/swinburne_logo.png"
      - "images/login-banner.jpg"
      - "images/favicon.png"
      - "images/arrow_drop_down.png"
  - from: build-resources/seed/planner-seed.db
    to: seed/planner-seed.db
